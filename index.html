<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>iClean — заявка на уборку</title>
<style>
:root{color-scheme:light;--bg:#fff;--card:#f4f8fd;--text:#263330;--muted:#6f7d79;--main:#3d7edb;--main-dark:#2a63b8;--line:#d9e3ef;--err:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:8px 0 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--main);color:#fff;display:grid;place-items:center;font-size:20px}
.link{font:600 13px Inter,Inter,system-ui,sans-serif;color:var(--main-dark);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:10px;background:var(--card)}
.lg{display:block;width:180px;max-width:55%;margin:0 auto 4px}
h1{font-size:28px;line-height:1.2;margin:8px 0 8px;font-weight:800;text-align:center}
.sub{color:var(--muted);margin:0 0 22px;text-align:center}
form,.result{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
label.l{display:block;font:600 14px Inter,system-ui,sans-serif;margin:0 0 6px}
.field{margin-bottom:16px}
input[type=text],input[type=number],input[type=date],input[type=time]{width:100%;font:17px Inter,system-ui,sans-serif;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--main);outline-offset:1px}
.svc{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font:16px Inter,system-ui,sans-serif;cursor:pointer}
.svc input{width:22px;height:22px;accent-color:#8dc532;flex:none}
.svc .n{flex:1}
.svc small{display:block;color:var(--muted);font-size:13px}
.svc .p{font-weight:600;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.promo{background:#eef7dc;border:1px solid #8dc532;color:#2f4a08;border-radius:14px;padding:12px 14px;margin:0 0 18px;font:600 15px Inter,system-ui,sans-serif;text-align:center}
input[type=date],input[type=time]{min-height:50px}
.err{color:var(--err);font:13px Inter,system-ui,sans-serif;min-height:18px;margin-top:4px}
.result{margin-top:14px}
.price{font-size:34px;font-weight:800;color:var(--main-dark)}
.time{font:15px Inter,system-ui,sans-serif;color:var(--text)}
.hint{color:var(--muted);font:14px Inter,system-ui,sans-serif;margin-top:4px}
.btns{display:grid;gap:10px;margin-top:14px}
button{font:700 16px Inter,Inter,system-ui,sans-serif;padding:15px;border-radius:999px;border:1px solid var(--main);cursor:pointer}
.primary{background:var(--main);color:#fff}
.primary:hover:not(:disabled){background:var(--main-dark)}
.second{background:transparent;color:var(--main-dark)}
button:disabled{opacity:.45;cursor:not-allowed}
footer{color:var(--muted);font:14px Inter,system-ui,sans-serif;padding:22px 0 8px;text-align:center}
.demo{font:12px Inter,system-ui,sans-serif;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>

  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="promo" id="promo"></div>

  <form id="form" novalidate>
    <div class="field">
      <label class="l" for="address">Адрес</label>
      <input type="text" id="address" autocomplete="street-address">
      <div class="err" id="eAddress"></div>
    </div>
    <div class="field">
      <label class="l" for="area">Площадь помещения, м²</label>
      <input type="number" id="area" min="1" inputmode="decimal" placeholder="Например, 54">
      <div class="err" id="eArea"></div>
    </div>
    <div class="field">
      <div class="row">
        <div>
          <label class="l" for="date">Дата уборки</label>
          <input type="date" id="date">
        </div>
        <div>
          <label class="l" for="time">Время начала</label>
          <input type="time" id="time">
        </div>
      </div>
      <div class="err" id="eDate"></div>
    </div>
    <div class="field" style="margin-bottom:0">
      <label class="l">Что нужно сделать</label>
      <div id="services"></div>
      <div class="err" id="eSvc"></div>
      <label class="svc" style="border-top:1px solid var(--line)"><input type="checkbox" id="heavy"><span class="n">Сильные загрязнения<small>Менеджер учтёт это при расчёте</small></span></label>
    </div>
  </form>

  <div class="result">
    <div class="price" id="price"></div>
        <div class="hint" id="priceHint"></div>
    <div class="btns">
      <button class="primary" id="send" type="button" disabled>Отправить заявку в Telegram</button>
      <button class="second" id="copy" type="button" disabled>Скопировать текст заявки</button>
    </div>
  </div>

  <footer id="footer"></footer>
  <div class="demo">Демо: услуги и цены из каталога iClean (Пермь), контакты — заглушки</div>
</div>

<script>
// ===== Все данные компании — только здесь (в проекте это будет файл config.js) =====
const CONFIG = {
  companyName: "iClean",
  city: "Пермь",
  promo: "Дарим скидку 500 рублей на первую уборку!",
  priceNote: "Стоимость зависит от типа уборки, площади, степени загрязнения и расположения объекта.",
  phone: "+7 (900) 000-00-00",        // ЗАМЕНИТЬ
  telegramUsername: "iclean_demo", // ЗАМЕНИТЬ
  heroTitle: "Соберите уборку и узнайте цену",
  heroSubtitle: "Выберите услуги, укажите адрес и площадь — мы получим готовую заявку.",
  addressPlaceholder: "ул. Ленина, 25, кв. 12",
  services: [ // price — «от», ₽
    { id: "deep",    name: "Генеральная уборка",              price: 4500 },
    { id: "repair",  name: "Уборка после ремонта",            price: 4500 },
    { id: "support", name: "Поддерживающая уборка",           price: 3000 },
    { id: "regular", name: "Регулярная поддерживающая уборка", price: 2500 },
    { id: "windows", name: "Мытье окон и балконов",           price: 3000 },
    { id: "furn",    name: "Чистка мебели",                   price: 2700 }
  ],
  currency: "₽"
};
// ====================================================================================

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/\u00a0/g, " ");
const dur = m => { const h = Math.floor(m / 60), r = m % 60; return (h ? h + " ч" : "") + (h && r ? " " : "") + (r ? r + " мин" : ""); };

document.title = CONFIG.companyName + " — заявка на уборку";
$("title").textContent = CONFIG.heroTitle;
$("subtitle").textContent = CONFIG.heroSubtitle;
$("promo").textContent = CONFIG.promo;
$("address").placeholder = CONFIG.addressPlaceholder;
$("footer").textContent = CONFIG.phone + " · " + CONFIG.city;
$("tgTop").href = "https://t.me/" + CONFIG.telegramUsername;

CONFIG.services.forEach(s => {
  const l = document.createElement("label");
  l.className = "svc";
  l.innerHTML = '<input type="checkbox" data-id="' + s.id + '"><span class="n">' + s.name + '</span><span class="p">от ' + fmt(s.price) + ' ' + CONFIG.currency + '</span>';
  $("services").appendChild(l);
});

let touched = { address: false, area: false, date: false, time: false };
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
$("date").min = todayStr();
const fmtDate = v => v.split("-").reverse().join(".");

function state() {
  const area = parseFloat($("area").value);
  const address = $("address").value.trim();
  const date = $("date").value, time = $("time").value;
  const chosen = CONFIG.services.filter(s => document.querySelector('[data-id="' + s.id + '"]').checked);
  return {
    area, address, date, time, dateOk: date !== "" && date >= todayStr(), timeOk: time !== "", chosen, heavy: $("heavy").checked,
    areaOk: area > 0, addressOk: address.length > 0, svcOk: chosen.length > 0,
    price: chosen.reduce((a, s) => a + s.price, 0)
  };
}

function requestText(s) {
  const lines = [
    "Здравствуйте! Хочу заказать уборку.",
    "Адрес: " + s.address,
    "Площадь: " + s.area + " м²",
    "Желаемая дата и время: " + fmtDate(s.date) + ", " + s.time,
    "Услуги:"
  ];
  s.chosen.forEach(x => lines.push("- " + x.name + " (от " + fmt(x.price) + " " + CONFIG.currency + ")"));
  if (s.heavy) lines.push("Сильные загрязнения: да");
  lines.push("Ориентировочно: от " + fmt(s.price) + " " + CONFIG.currency);
  return lines.join("\n");
}

function render() {
  const s = state();
  $("eAddress").textContent = touched.address && !s.addressOk ? "Укажите адрес" : "";
  $("eArea").textContent = touched.area && !s.areaOk ? "Укажите площадь больше 0" : "";
  $("eDate").textContent = (touched.date && !s.dateOk) ? "Выберите дату не раньше сегодняшней" : (touched.time && !s.timeOk) ? "Укажите время начала" : "";
  if (s.svcOk) {
    $("price").textContent = "от " + fmt(s.price) + " " + CONFIG.currency;
    $("priceHint").textContent = "Ориентировочная стоимость. " + CONFIG.priceNote + " Точную цену подтвердит менеджер.";
  } else {
    $("price").textContent = "—";
    $("priceHint").textContent = "Выберите хотя бы одну услугу";
  }
  const ok = s.addressOk && s.areaOk && s.dateOk && s.timeOk && s.svcOk;
  $("send").disabled = !ok;
  $("copy").disabled = !ok;
}

["address", "area", "date", "time"].forEach(id => $(id).addEventListener("blur", () => { touched[id] = true; render(); }));
$("form").addEventListener("input", render);
$("form").addEventListener("change", render);

$("send").addEventListener("click", () => {
  window.open("https://t.me/" + CONFIG.telegramUsername + "?text=" + encodeURIComponent(requestText(state())), "_blank", "noopener");
});

$("copy").addEventListener("click", async () => {
  const text = requestText(state());
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }
  $("copy").textContent = "Скопировано";
  setTimeout(() => $("copy").textContent = "Скопировать текст заявки", 1800);
});

render();
</script>
</body>
</html>
